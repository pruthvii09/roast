# Production-shaped compose file — exercises the Dockerfile's `prod`
# target (gunicorn, no dev/test dependencies, non-root user) instead of
# `dev`'s runserver, and adds the `beat` service the reconciliation sweeps
# (apps.roasts.tasks.reconcile_stuck_roast_runs,
# apps.extraction.tasks.reconcile_stuck_extraction_tasks) need to run at
# all — docker-compose.yml has no beat service.
#
# `db`/`redis` are included here for a simple, self-contained
# single-host deployment. At real scale, point POSTGRES_HOST/REDIS_URL/
# CELERY_BROKER_URL/CELERY_RESULT_BACKEND (in your env file) at managed
# services instead (RDS/Cloud SQL, ElastiCache/Memorystore) and drop
# these two services — nothing else in this file assumes they're
# container-local.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up --build -d
#
# No source bind-mount (unlike docker-compose.yml) — this only ever runs
# the image as built, matching how it would actually be deployed.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roast_anything}
      POSTGRES_USER: ${POSTGRES_USER:-roast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roast}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: prod
    volumes:
      - media_data:/app/media
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    ports:
      - "${WEB_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health/ready/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: prod
    command: celery -A config worker -l info
    volumes:
      - media_data:/app/media
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      # Migrations already run once by `web`'s entrypoint — running them
      # again here is idempotent but redundant; disabled to avoid several
      # services racing `migrate` against each other on startup.
      DJANGO_AUTO_MIGRATE: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: prod
    command: celery -A config beat -l info
    volumes:
      - media_data:/app/media
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_AUTO_MIGRATE: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media_data:
